name: NK Auto Heartbeat

on:
  schedule:
    - cron: '*/40 * * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: appveyor # 确保修改的是 A 代码所在的分支

      - name: Update Heartbeat File
        run: |
          date > heartbeat.txt
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add heartbeat.txt
          git commit -m "Heartbeat update: $(date)"
          git push origin appveyor
