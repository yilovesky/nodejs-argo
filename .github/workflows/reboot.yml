name: NK Auto Heartbeat

on:
  schedule:
    - cron: '*/45 * * * *' # 每 45 分钟触发一次，预留波动时间
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: appveyor # 确保指向 A 代码分支
          token: ${{ secrets.GITHUB_TOKEN }} # 显式授权推送权限

      - name: Update Heartbeat File
        run: |
          # 1. 生成 1 到 300 秒（5 分钟）之间的随机延迟
          RAND_DELAY=$(( RANDOM % 300 + 1 ))
          echo "为了安全保活，随机等待 $RAND_DELAY 秒后提交..."
          sleep $RAND_DELAY

          # 2. 生成一个随机的 4 位后缀用于 Commit 信息，模拟不同更新 [cite: 2026-01-14]
          RAND_ID=$(openssl rand -hex 2)
          
          # 3. 更新保活文件
          date > heartbeat.txt
          
          # 4. 配置 Git 并推送
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add heartbeat.txt
          # Commit 信息中加入随机 ID，让日志看起来不重复 [cite: 2026-01-13]
          git commit -m "Update NK-A service [ID: ${RAND_ID}] at $(date)"
          git push origin appveyor
