- name: Trigger AppVeyor Build
        run: |
          curl -v -X POST "https://ci.appveyor.com/api/account/baico/projects/baico/nodejs-argo/builds" \
            -H "Authorization: Bearer ${{ secrets.APPVEYOR_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"branch\": \"appveyor\"}"
