- name: Trigger AppVeyor via Official API
        run: |
          curl -v -X POST "https://ci.appveyor.com/api/builds" \
            -H "Authorization: Bearer ${{ secrets.APPVEYOR_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
                  \"accountName\": \"baico\",
                  \"projectSlug\": \"nodejs-argo\",
                  \"branch\": \"appveyor\"
                }"
